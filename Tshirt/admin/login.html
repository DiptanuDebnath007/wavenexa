<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Portal — WaveNexa</title>
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../css/style.css">
  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      overflow: auto;
      padding: 24px 16px;
    }

    .login-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      background: radial-gradient(ellipse at 30% 30%, rgba(108, 99, 255, 0.2) 0%, transparent 60%),
        radial-gradient(ellipse at 80% 70%, rgba(255, 101, 132, 0.12) 0%, transparent 50%);
    }

    .login-bg::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image: repeating-linear-gradient(0deg, transparent, transparent 40px, rgba(108, 99, 255, 0.03) 40px, rgba(108, 99, 255, 0.03) 41px),
        repeating-linear-gradient(90deg, transparent, transparent 40px, rgba(108, 99, 255, 0.03) 40px, rgba(108, 99, 255, 0.03) 41px);
    }

    .login-card {
      position: relative;
      z-index: 1;
      background: rgba(15, 15, 26, 0.85);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      padding: 44px 40px;
      width: 100%;
      max-width: 440px;
      backdrop-filter: blur(24px);
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(108, 99, 255, 0.15);
      animation: scaleIn 0.4s ease;
    }

    .login-logo {
      text-align: center;
      margin-bottom: 28px;
    }

    .login-logo .nav-logo {
      font-size: 2rem;
    }

    .login-logo p {
      font-size: 0.85rem;
      color: var(--text-dim);
      margin-top: 4px;
    }

    .login-title {
      font-size: 1.35rem;
      font-weight: 800;
      margin-bottom: 4px;
      text-align: center;
    }

    .login-sub {
      font-size: 0.88rem;
      color: var(--text-muted);
      margin-bottom: 28px;
      text-align: center;
    }

    .login-error {
      padding: 12px 16px;
      border-radius: var(--radius);
      background: rgba(255, 101, 132, 0.1);
      border: 1px solid rgba(255, 101, 132, 0.3);
      color: var(--accent);
      font-size: 0.88rem;
      display: none;
      margin-bottom: 20px;
    }

    .login-success {
      padding: 12px 16px;
      border-radius: var(--radius);
      background: rgba(0, 229, 153, 0.1);
      border: 1px solid rgba(0, 229, 153, 0.3);
      color: var(--secondary);
      font-size: 0.88rem;
      display: none;
      margin-bottom: 20px;
    }

    .demo-hint {
      background: rgba(108, 99, 255, 0.08);
      border: 1px dashed rgba(108, 99, 255, 0.3);
      border-radius: var(--radius);
      padding: 12px 16px;
      margin-bottom: 24px;
      font-size: 0.82rem;
      color: var(--text-muted);
      cursor: pointer;
      transition: var(--transition);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .demo-hint:hover {
      background: rgba(108, 99, 255, 0.15);
      border-color: var(--primary);
    }

    .demo-hint strong {
      color: var(--text);
    }

    .demo-pill {
      background: var(--primary);
      color: white;
      font-size: 0.72rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 99px;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      justify-content: center;
      width: 100%;
      margin-top: 24px;
      font-size: 0.88rem;
      color: var(--text-dim);
      transition: var(--transition);
      text-decoration: none;
    }

    .back-link:hover {
      color: var(--primary);
    }

    .pw-wrap {
      position: relative;
    }

    .pw-toggle {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      cursor: pointer;
      font-size: 1.1rem;
      color: var(--text-dim);
      background: none;
      border: none;
      transition: var(--transition);
    }

    .pw-toggle:hover {
      color: var(--primary);
    }

    @media (max-width: 480px) {
      .login-card {
        padding: 32px 20px;
      }
    }
  </style>
</head>

<body>
  <div class="login-bg"></div>
  <div class="login-card">
    <div class="login-logo">
      <a href="../index.html" class="nav-logo">Wave<span>Nexa</span></a>
      <p>Store Management System</p>
    </div>
    <h2 class="login-title">Admin Portal 🔐</h2>
    <p class="login-sub">Sign in with your admin credentials</p>

    <div class="login-error" id="loginError">❌ Invalid email or password. Please try again.</div>
    <div class="login-success" id="loginSuccess">✅ Access granted! Loading dashboard...</div>

    <form id="loginForm">
      <div class="form-group">
        <label class="form-label">Admin Email</label>
        <input type="email" class="form-control" id="adminEmail" placeholder="admin@wavenexa.com" autocomplete="email"
          required>
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <div class="pw-wrap">
          <input type="password" class="form-control" id="adminPw" placeholder="••••••••"
            autocomplete="current-password" required>
          <button type="button" class="pw-toggle" id="pwToggle" title="Toggle password visibility">👁</button>
        </div>
      </div>
      <button type="submit" class="btn btn-primary btn-full btn-lg" id="loginBtn">
        🔐 Sign In to Dashboard
      </button>
    </form>

    <a href="../index.html" class="back-link">← Return to Store</a>
  </div>

  <script src="../js/store.js"></script>
  <script>
    (function () {
      if (Store.isAdminLoggedIn()) {
        window.location.href = 'dashboard.html';
        return;
      }

      const demoHint = document.getElementById('demoHint');
      if (demoHint) {
        demoHint.addEventListener('click', () => {
          document.getElementById('adminEmail').value = 'admin@wavenexa.com';
          document.getElementById('adminPw').value = 'admin123';
        });
      }

      document.getElementById('pwToggle')?.addEventListener('click', () => {
        const inp = document.getElementById('adminPw');
        const toggle = document.getElementById('pwToggle');
        if (inp.type === 'password') { inp.type = 'text'; toggle.textContent = '🙈'; }
        else { inp.type = 'password'; toggle.textContent = '👁'; }
      });

      document.getElementById('loginForm')?.addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('adminEmail').value.trim();
        const pw = document.getElementById('adminPw').value;
        const btn = document.getElementById('loginBtn');
        const err = document.getElementById('loginError');
        const success = document.getElementById('loginSuccess');

        btn.disabled = true;
        btn.textContent = '⏳ Verifying...';
        err.style.display = 'none';
        success.style.display = 'none';

        try {
          const result = await Store.customerLogin(email, pw);
          if (result.ok && result.role === 'admin') {
            success.style.display = 'block';
            btn.textContent = '✅ Access Granted!';
            setTimeout(() => window.location.href = 'dashboard.html', 600);
          } else {
            err.textContent = '❌ ' + (result.error || 'Invalid credentials or missing admin privileges.');
            err.style.display = 'block';
            btn.disabled = false;
            btn.textContent = '🔐 Sign In to Dashboard';
            document.getElementById('adminPw').value = '';
            document.getElementById('adminPw').focus();
          }
        } catch (ex) {
          err.textContent = '❌ Something went wrong. Please try again.';
          err.style.display = 'block';
          btn.disabled = false;
          btn.textContent = '🔐 Sign In to Dashboard';
        }
      });
    })();
  </script>
</body>

</html>
